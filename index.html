<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Francis Cooke Family Tree</title><style>body{font:16px system-ui,sans-serif;background:#f6f7f4;color:#20362c;margin:0}header{background:#173c30;color:white;padding:22px 16px}main{max-width:720px;margin:auto;padding:18px}.card{background:white;border:1px solid #d7ded9;border-radius:14px;padding:16px;margin:12px 0}.child{display:block;width:100%;text-align:left;background:#fff;border:1px solid #b9c9c0;border-radius:10px;padding:14px;margin:8px 0;font:inherit;color:#173c30}.child:active{background:#e2efe8}.small{font-size:13px;color:#607268}.back{background:none;border:0;padding:12px 0;color:#176047;font:inherit}h2{margin:5px 0}h3{margin-bottom:6px}.note{background:#fff6e0;padding:12px;border-radius:8px;font-size:14px}</style></head><body><header><strong>Mayflower Descendant Explorer</strong><div>Francis Cooke family</div></header><main><div id="app"></div></main><script>
const P={
francis:{name:"Francis Cooke",dates:"c. 1583–1663",spouses:[{name:"Hester Mahieu",children:["jane","john","jacob","hester","mary"]}]},
jane:{name:"Jane Cooke",spouses:[{name:"Experience Mitchell",children:[]}]},
john:{name:"John Cooke",spouses:[{name:"Sarah Warren",children:[]}]},
jacob:{name:"Jacob Cooke",dates:"c. 1618–1675",spouses:[{name:"Damaris Hopkins",children:["elizabeth","caleb","jacobjr","maryj","martha","francisj","ruth"]},{name:"Elizabeth (Lettice) Shurtleff",children:["sarah","rebecca"],probable:true}]},
hester:{name:"Hester Cooke",spouses:[{name:"Richard Wright",children:[]}]},
mary:{name:"Mary Cooke",spouses:[{name:"John Thompson",children:[]}]},
elizabeth:{name:"Elizabeth Cooke",dates:"1647/48",spouses:[{name:"John Doty",children:[]}]},
caleb:{name:"Caleb Cooke",dates:"1651",spouses:[{name:"Jane (surname uncertain)",children:[]}]},
jacobjr:{name:"Jacob Cooke Jr.",dates:"1653",spouses:[{name:"Lydia Miller",children:[]}]},
maryj:{name:"Mary Cooke",dates:"1656/57",spouses:[{name:"John Rickard",children:[]}]},
martha:{name:"Martha Cooke",dates:"1658/59",spouses:[{name:"Elkanah Cushman",children:[]}]},

rebecca:{name:"Rebecca Cooke",probable:true,spouses:[]}
};let path=["francis"];const el=document.getElementById("app");function openPerson(id){path.push(id);render()}function back(){if(path.length>1)path.pop();render()}function render(){const id=path[path.length-1],p=P[id];el.innerHTML=(path.length>1?'<button class="back" id="back">← Back to '+P[path[path.length-2]].name+'</button>':'')+'<div class="card"><div class="small">Generation '+path.length+'</div><h2>'+p.name+'</h2><div>'+ (p.dates||"Dates not recorded")+'</div>'+(p.probable?'<p class="note">Probable relationship: further verification required.</p>':'')+'</div>'+p.spouses.map(s=>'<section class="card"><h3>Spouse: '+s.name+'</h3>'+(s.probable?'<p class="note">Children below are probable, not conclusively established.</p>':'')+(s.children.length?s.children.map(c=>'<button class="child" data-person="'+c+'">'+P[c].name+(P[c].dates?' · '+P[c].dates:'')+' →</button>').join(''):'<p class="small">No further children entered in this research sample. This does not mean there were none.</p>')+'</section>').join('')+'<p class="note">Research sample, not a complete or independently verified genealogy. Check individual relationships against original records and Mayflower Society publications. Source guide: <a href="https://themayflowersociety.org/">General Society of Mayflower Descendants</a>.</p>';document.querySelectorAll('[data-person]').forEach(b=>b.addEventListener('click',()=>openPerson(b.dataset.person)));const btn=document.getElementById('back');if(btn)btn.addEventListener('click',back)}render();
</script></body></html>
