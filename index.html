};const ROOT_CHILDREN=["jane","john","jacob","hester","mary"];

function researchSummary(){
 const all=GENERATION3.filter(id=>P[id]);
 const researched=all.filter(id=>(P[id].spouses||[]).some(s=>(s.children||[]).length>0));
 const noChildren=all.filter(id=>!researched.includes(id));
 return '<section class="card"><h3>Generation 4 research checklist</h3><p class="small">'+researched.length+' of '+all.length+' third-generation people have at least one recorded child. This is coverage, NOT proof that any family group is complete.</p>'+
 ROOT_CHILDREN.map(id=>{const ids=P[id].spouses.flatMap(s=>s.children||[]);const done=ids.filter(x=>researched.includes(x));return '<p><strong>'+P[id].name+'</strong>: '+done.length+'/'+ids.length+' with descendants entered</p>';}).join('')+
 '<details><summary>Families still needing descendant research ('+noChildren.length+')</summary><ul>'+noChildren.map(id=>'<li>'+P[id].name+' — research pending; no children entered</li>').join('')+'</ul></details>'+
 '<p class="small">The five founder family groups are recorded from the Mayflower Society. Later-generation entries are provisional until checked against the Francis Cooke Silver Book and original records. A family with zero entered children is not necessarily childless.</p></section>';
}

r-generation links are published secondary claims pending original-record review. Jacob branch sources: <a href="https://pilgrimhopkins.com/heritage-lineage-descendants-third-generation-continued/">Hopkins Society third generation</a>; <a href="https://pilgrimhopkins.com/heritage-lineage-descendants-fourth-generation-08/">fourth generation</a>; <a href="https://pilgrimhopkins.com/heritage-lineage-descendants-fifth-generation-39/">fifth generation</a>; <a href="https://pilgrimhopkins.com/heritage-lineage-descendants-sixth-generation-38/">sixth generation</a>; <a href="https://sail1620.org/images/downloads/The_Mayflower_Descendant_Quarterly_Magazine_of_Pilgrim_History_and_Genealogy___Massachusetts_Society_of_Mayflower_Descendants/the_mayflower_descendant___quarterly_magazine_vol_18_massachusetts_society__1915_.pdf">Francis Cooke will</a>; <a href="https://pilgrimhopkins.com/wp-content/uploads/2024/12/Volume-3-Issue-1-June-2009.pdf">Hopkins Society lineage article</a>.</p>';document.querySelectorAll('[data-person]').forEach(b=>b.addEventListener('click',()=>openPerson(b.dataset.person)));const btn=document.getElementById('back');if(btn)btn.addEventListener('click',back)}render();
