};let path=["francis"];const el=document.getElementById("app");function openPerson(id){path.push(id);render()}function back(){if(path.length>1)path.pop();render()}function render(){const id=path[path.length-1],p=P[id];el.innerHTML=(path.length>1?'<button class="back" id="back">← Back to '+P[path[path.length-2]].name+'</button>':'')+'<div class="card"><div class="small">Generation '+path.length+'</div><h2>'+p.name+'</h2><div>'+ (p.dates||"Dates not recorded")+'</div>'+(p.probable?'<p class="note">Probable relationship: further verification required.</p>':'')+'</div>'+p.spouses.map(s=>'<section class="card"><h3>Spouse: '+s.name+'</h3>'+(s.probable?'<p class="note">Children below are probable, not conclusively established.</p>':'')+(s.children.length?s.children.map(c=>'<button class="child" data-person="'+c+'">'+P[c].name+(P[c].dates?' · '+P[c].dates:'')+' →</button>').join(''):'<p class="small">Further descendants not yet researched. This does not mean there were none.</p>')+'</section>').join('')+'<p class="note">Research dataset remains incomplete. Later-generation names come from published transcriptions and compilations and need original-record cross-checking. Check individual relationships against original records and Mayflower Society publications. Sources: <a href="https://themayflowersociety.org/passenger-profile/passenger-profiles/the-cooke-family/">Mayflower Society</a>; <a href="https://edwardwilcoxdescendants.com/hello-world/">Wilcox family research</a>; <a href="https://globaluserfiles.com/media/1687_b67ca4bb2e69276338cf9c2d77d167f2dad32c48.pdf/o/twc%201987%20c.pdf">Warren Cousins (1987), Wilcox lineage</a>. Later-generation links are published secondary claims pending original-record review. Jacob branch sources: <a href="https://pilgrimhopkins.com/heritage-lineage-descendants-third-generation-continued/">Hopkins Society third generation</a>; <a href="https://pilgrimhopkins.com/heritage-lineage-descendants-fourth-generation-08/">fourth generation</a>; <a href="https://pilgrimhopkins.com/heritage-lineage-descendants-fifth-generation-39/">fifth generation</a>; <a href="https://pilgrimhopkins.com/heritage-lineage-descendants-sixth-generation-38/">sixth generation</a>; <a href="https://sail1620.org/images/downloads/The_Mayflower_Descendant_Quarterly_Magazine_of_Pilgrim_History_and_Genealogy___Massachusetts_Society_of_Mayflower_Descendants/the_mayflower_descendant___quarterly_magazine_vol_18_massachusetts_society__1915_.pdf">Francis Cooke will</a>; <a href="https://pilgrimhopkins.com/wp-content/uploads/2024/12/Volume-3-Issue-1-June-2009.pdf">Hopkins Society lineage article</a>.</p>';document.querySelectorAll('[data-person]').forEach(b=>b.addEventListener('click',()=>openPerson(b.dataset.person)));const btn=document.getElementById('back');if(btn)btn.addEventListener('click',back)}render();
